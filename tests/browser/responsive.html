<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MeterWise responsive browser QA</title>
  <style>
    body { margin: 24px; background: #e7ece9; color: #243c35; font: 16px system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 20px; margin-bottom: 18px; }
    h1 { font-size: 20px; margin: 0; }
    select { padding: 8px; font: inherit; }
    iframe { display: block; width: 390px; height: 844px; border: 1px solid #bac8c0; background: white; }
    p { font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>MeterWise responsive browser QA</h1>
    <label>App viewport
      <select id="viewport-width">
        <option value="390">390 px · phone layout</option>
        <option value="768">768 px · tablet layout</option>
        <option value="1280">1280 px · desktop layout</option>
      </select>
    </label>
  </header>
  <iframe id="meterwise-viewport" title="MeterWise app viewport" src="/#overview"></iframe>
  <p>This local-only harness checks responsive CSS and interaction at real iframe viewport widths. It does not emulate mobile hardware or touch input.</p>
  <script>
    document.querySelector('#viewport-width').addEventListener('change',event=>{
      document.querySelector('#meterwise-viewport').style.width=event.target.value+'px';
    });
  </script>
</body>
</html>
